[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fmc-setup"
description = "Configure Cisco Secure Firewall Management Center (FMC) from an Excel workbook"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Dominik Nowicki, NetContractor" }]
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
    "openpyxl>=3.1",
]
keywords = ["cisco", "fmc", "firepower", "ftd", "firewall", "automation", "rest-api", "excel"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking :: Firewalls",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
fmc-setup = "fmc_setup.cli:main"

[tool.setuptools.dynamic]
version = { attr = "fmc_setup.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
